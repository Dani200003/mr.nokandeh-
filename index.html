<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی | وبلاگ من</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">
    <header class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-indigo-600">🚀 وبلاگ شخصی من</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <h1 class='text-3xl font-extrabold mb-6 text-gray-900'>آخرین مقالات آموزشی 📚</h1>
        <div id="articles-container" class="space-y-4">
            <p class="text-gray-500">در حال دریافت مقالات...</p>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-sm text-gray-500">
        ساخته شده با عشق و جاوا اسکریپت ⚡
    </footer>

    <script>
        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('articles-container');
                container.innerHTML = '';
                
                data.sort((a, b) => b.id - a.id).forEach(art => {
                    const articleHTML = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border hover:shadow-md transition">
                            <h2 class="text-xl font-bold text-gray-900 mb-2">
                                <a href="article.html?id=${art.id}" class="hover:text-indigo-600">${art.title}</a>
                            </h2>
                            <p class="text-gray-600 text-sm line-clamp-2">${art.summary}</p>
                            <div class="mt-4 flex justify-between items-center text-xs text-gray-400">
                                <span>تاریخ انتشار: ${art.date}</span>
                                <a href="article.html?id=${art.id}" class="text-indigo-600 font-semibold hover:underline">ادامه مطلب &larr;</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += articleHTML;
                });
            })
            .catch(error => {
                document.getElementById('articles-container').innerHTML = '<p class="text-red-500">خطا در بارگذاری مقالات!</p>';
            });
    </script>
</body>
</html>
