<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله | وبلاگ من</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">
    <header class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-indigo-600">🚀 وبلاگ شخصی من</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl" id="article-content">
        <p class="text-gray-500">در حال دریافت مقاله...</p>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = parseInt(urlParams.get('id'));

        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                const article = data.find(a => a.id === articleId);
                const container = document.getElementById('article-content');

                if (article) {
                    document.title = article.title + " | وبلاگ من";
                    container.innerHTML = `
                        <article class="bg-white p-8 rounded-2xl shadow-sm border">
                            <h1 class="text-3xl font-extrabold text-gray-900 mb-4">${article.title}</h1>
                            <p class="text-indigo-600 font-medium text-sm mb-6 pb-4 border-b">${article.summary} - ${article.date}</p>
                            <div class="prose max-w-none text-gray-700 leading-relaxed whitespace-pre-line">${article.body}</div>
                            <div class="mt-8 pt-4 border-t">
                                <a href="index.html" class="text-indigo-600 text-sm font-semibold hover:underline">&larr; بازگشت به صفحه اصلی</a>
                            </div>
                        </article>
                    `;
                } else {
                    container.innerHTML = '<h1 class="text-2xl font-bold text-red-500">مقاله یافت نشد!</h1>';
                }
            });
    </script>
</body>
</html>
